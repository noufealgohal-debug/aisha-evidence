<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AishaEvidence | منصة الشواهد التعليمية</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f4f8f6;
color:#173c32;
}
.container{
max-width:430px;
margin:auto;
padding:35px 22px;
}
.logo{
width:78px;
height:78px;
margin:25px auto;
border-radius:22px;
background:#0b6b53;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
box-shadow:0 10px 25px #0b6b5330;
}
h1{
text-align:center;
color:#0b6b53;
margin:0;
}
.subtitle{
text-align:center;
color:#71817b;
margin:10px 0 30px;
}
.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 10px 35px #00000010;
}
label{
display:block;
font-weight:bold;
margin:15px 0 7px;
}
input{
width:100%;
padding:14px;
border:1px solid #d9e3df;
border-radius:12px;
font-size:15px;
}
button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
margin-top:18px;
font-size:16px;
font-weight:bold;
}
.login{
background:#0b6b53;
color:white;
}
.signup{
background:#edf4f1;
color:#0b6b53;
}
.footer{
text-align:center;
color:#899690;
font-size:12px;
margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">✦</div>

<h1>AishaEvidence</h1>

<div class="subtitle">
منصة الشواهد التعليمية
</div>

<div class="card">

<label>البريد الإلكتروني</label>
<input type="email" placeholder="أدخلي البريد الإلكتروني">

<label>كلمة المرور</label>
<input type="password" placeholder="أدخلي كلمة المرور">

<button class="login">
دخول
</button>

<button class="signup">
إنشاء حساب جديد
</button>

</div>

<div class="footer">
منصة تعليمية رقمية لتنظيم وحفظ الشواهد التعليمية
</div>

</div>

</body>
</html>
